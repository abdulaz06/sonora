[package]
name = "sonora-dsp-wasm"
description = "WebAssembly bindings for the Sonora analysis crate"
version.workspace = true
edition.workspace = true
authors.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
sonora-dsp = { path = "../sonora-dsp" }
serde_json = "1"
wasm-bindgen = "0.2"

[package.metadata.wasm-pack.profile.release]
wasm-opt = false
